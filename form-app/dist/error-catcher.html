<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错误捕获</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .error { background: #fee; border: 1px solid #c00; padding: 10px; margin: 10px 0; word-wrap: break-word; }
    .info { background: #efe; border: 1px solid #0c0; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>浏览器环境检测</h1>
  <div id="info"></div>
  <div id="errors"></div>

  <script>
    var info = document.getElementById('info');
    var errors = document.getElementById('errors');

    // 显示浏览器信息
    info.innerHTML = '<div class="info">' +
      '<strong>User Agent:</strong><br>' + navigator.userAgent + '<br><br>' +
      '<strong>Platform:</strong> ' + navigator.platform + '<br>' +
      '<strong>语言:</strong> ' + navigator.language + '<br>' +
      '</div>';

    // 捕获所有错误
    window.onerror = function(msg, url, line, col, error) {
      var div = document.createElement('div');
      div.className = 'error';
      div.innerHTML = '<strong>错误:</strong><br>' + msg + '<br>' +
        '<strong>位置:</strong> ' + url + ':' + line + ':' + col + '<br>' +
        '<strong>详情:</strong> ' + (error ? error.stack : 'N/A');
      errors.appendChild(div);
      return true;
    };

    // 测试现代 JS 特性
    var tests = {
      'const/let': function() { const a = 1; let b = 2; },
      '箭头函数': function() { var f = () => 1; },
      'Promise': function() { return new Promise(function(r) { r(1); }); },
      'async/await': function() { return eval('(async () => 1)()'); },
      'ES Modules': function() { return 'import' in document.createElement('script'); }
    };

    for (var name in tests) {
      try {
        tests[name]();
        info.innerHTML += '<div class="info">✓ 支持: ' + name + '</div>';
      } catch (e) {
        info.innerHTML += '<div class="error">✗ 不支持: ' + name + '<br>' + e.message + '</div>';
      }
    }
  </script>
</body>
</html>
