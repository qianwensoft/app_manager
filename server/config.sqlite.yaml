server:
    port: 8080
    host: 0.0.0.0
    mode: release
    allow_register: false
    public_base_url: ""
    trusted_proxies: []
database:
    type: sqlite
    dsn: ./data/app-manager.db
storage:
    path: ./uploads
    max_size_mb: 500
adb:
    path: adb
    timeout: 30
ffmpeg:
    path: ""
jwt:
    secret: change-me-in-production
    expire_hour: 24
heartbeat:
    interval: 0
    timeout: 0
mqtt:
    enabled: false
    broker: tcp://localhost:1883
    username: ""
    password: ""
    client_id: app-manager
    qos: 1
claude:
    api_key: ""  # Set via CLAUDE_API_KEY environment variable
    model: claude-sonnet-4-6
    base_url: ""  # Optional: set custom API base URL
channel:
    kafka:
        brokers: []
        group_id: ""
        topics: []
        enabled: false
    kafka_rest_proxy_url: ""
rate_limit:
    enabled: false
    login_per_minute: 20
    login_burst: 5
    open_api_per_minute: 120
    open_api_burst: 30
    mcp_per_minute: 60
    mcp_burst: 15
cluster:
    enabled: false
    node_id: ""
    redis_url: redis://127.0.0.1:6379/0
