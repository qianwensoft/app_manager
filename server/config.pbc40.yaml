# pbc40 生产部署配置：192.168.102.40:88
# 部署目录：/opt/app-manager
# 用法：./app-manager server/config.pbc40.yaml

server:
  port: 88
  host: 0.0.0.0
  mode: release

database:
  type: sqlite
  dsn: ./data/app-manager.db

storage:
  path: ./uploads
  max_size_mb: 2000

adb:
  path: adb
  timeout: 30

ffmpeg:
  path: ""

jwt:
  secret: change-me-pbc40-production
  expire_hour: 168

cluster:
  enabled: false

rate_limit:
  enabled: false
  login_per_minute: 20
  login_burst: 5
  open_api_per_minute: 120
  open_api_burst: 30
  mcp_per_minute: 60
  mcp_burst: 15

mqtt:
  enabled: false
  broker: tcp://localhost:1883
  username: ""
  password: ""
  client_id: app-manager
  qos: 1
