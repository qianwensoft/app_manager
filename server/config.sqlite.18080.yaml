# 本地零依赖启动：SQLite + 内嵌存储，无需 MySQL
# 端口改为 18080，避免与本机已有服务冲突。

server:
  port: 18080
  host: 0.0.0.0
  mode: release

database:
  type: sqlite
  dsn: ./data/app-manager.db

storage:
  path: ./uploads
  max_size_mb: 500

adb:
  path: adb
  timeout: 30

ffmpeg:
  path: ""

jwt:
  secret: change-me-in-production
  expire_hour: 24

