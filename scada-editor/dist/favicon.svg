<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="磐石 Bedrock app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2A3A"/>
      <stop offset="1" stop-color="#11161F"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="128" y1="40" x2="128" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BE0C8"/>
      <stop offset="1" stop-color="#19B8A6"/>
    </linearGradient>
    <linearGradient id="stoneMid" x1="128" y1="96" x2="128" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C7491"/>
      <stop offset="1" stop-color="#3E5168"/>
    </linearGradient>
    <linearGradient id="stoneBot" x1="128" y1="150" x2="128" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#41556E"/>
      <stop offset="1" stop-color="#28384C"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="72" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BE0C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3BE0C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app icon plate -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- top node glow -->
  <circle cx="128" cy="72" r="58" fill="url(#glow)"/>

  <!-- bottom stone (widest base) -->
  <path d="M128 150 L210 196 L128 242 L46 196 Z" fill="url(#stoneBot)"/>
  <path d="M128 150 L210 196 L128 242 Z" fill="#000000" opacity="0.16"/>

  <!-- middle stone -->
  <path d="M128 100 L186 132 L128 164 L70 132 Z" fill="url(#stoneMid)"/>
  <path d="M128 100 L186 132 L128 164 Z" fill="#000000" opacity="0.16"/>

  <!-- top stone = glowing hub node -->
  <path d="M128 46 L164 67 L128 88 L92 67 Z" fill="url(#stoneTop)"/>
  <path d="M128 46 L164 67 L128 88 Z" fill="#ffffff" opacity="0.20"/>

  <!-- connection sparks radiating from hub -->
  <g stroke="#3BE0C8" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="88" x2="128" y2="104"/>
  </g>
</svg>
